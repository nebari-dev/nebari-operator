cases:
  minimal:
    enabled: false
    metadata:
      name: metadata.name
    spec:
      hostname: spec.hostname
      service:
        name: spec.service.name
        port: 1
  static:
    enabled: false
    metadata:
      name: static-app
      namespace: default
      labels:
        app.kubernetes.io/name: static-app
    spec:
      hostname: static.nebari.local
      service:
        name: static-svc
        port: 80
      auth:
        enabled: true
        provider: keycloak
        provisionClient: true
        enforceAtGateway: false
        redirectURI: /*
        scopes:
          - openid
          - profile
          - email
      routing:
        routes:
          - pathPrefix: /
            pathType: PathPrefix
      landingPage:
        enabled: true
        displayName: Static
        description: Static fixture app
        category: misc
        priority: 1
        healthCheck:
          enabled: true
          path: /health
  computed:
    enabled: false
    component: frontend
    servicePort: 8080
    nebariApp:
      hostname: computed.nebari.local
      auth:
        enabled: false
  multi:
    enabled: false
    apps:
      - component: frontend
        servicePort: 80
        nebariApp:
          hostname: chat.nebari.local
          auth:
            enabled: true
            provider: keycloak
            provisionClient: true
            enforceAtGateway: false
            redirectURI: /*
            scopes:
              - openid
              - profile
              - email
          routing:
            routes:
              - pathPrefix: /
                pathType: PathPrefix
          landingPage:
            enabled: true
            displayName: Chat
            description: Chat with AI models
            category: AI
            priority: 1
            healthCheck:
              enabled: true
              path: /health
      - component: api
        servicePort: 8000
        nebariApp:
          hostname: api.nebari.local
          routing:
            routes:
              - pathPrefix: /
                pathType: PathPrefix
