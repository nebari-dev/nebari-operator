cases:
  minimal:
    enabled: false
    metadata:
      name: metadata.name
    spec:
      hostname: spec.hostname
      service:
        name: spec.service.name
        port: 1
  static:
    enabled: false
    metadata:
      name: static-app
      namespace: default
      labels:
        app.kubernetes.io/name: static-app
    spec:
      hostname: static.nebari.local
      service:
        name: static-svc
        port: 80
      auth:
        enabled: true
        provider: keycloak
        provisionClient: true
        enforceAtGateway: false
        redirectURI: /*
        scopes:
          - openid
          - profile
          - email
      routing:
        routes:
          - pathPrefix: /
            pathType: PathPrefix
      landingPage:
        enabled: true
        displayName: Static
        description: Static fixture app
        category: misc
        priority: 1
        healthCheck:
          enabled: true
          path: /health
  multi:
    enabled: false
    apps:
      - component: frontend
        servicePort: 80
        nebariApp:
          hostname: chat.nebari.local
          auth:
            enabled: true
            provider: keycloak
            provisionClient: true
            enforceAtGateway: false
            redirectURI: /*
            scopes:
              - openid
              - profile
              - email
          routing:
            routes:
              - pathPrefix: /
                pathType: PathPrefix
          landingPage:
            enabled: true
            displayName: Chat
            description: Chat with AI models
            category: AI
            priority: 1
            healthCheck:
              enabled: true
              path: /health
      - component: api
        servicePort: 8000
        nebariApp:
          hostname: api.nebari.local
          # Consumer sets service.name, which overlaps the computed value
          # (the component name "api"). mergeOverwrite gives precedence to
          # its second argument (this nebariApp block), so "api-external"
          # must survive while the computed service.port (8000) fills the gap.
          service:
            name: api-external
          routing:
            routes:
              - pathPrefix: /
                pathType: PathPrefix
  templating:
    enabled: false
    metadata:
      name: "test-{{ .Release.Name }}-app"
      namespace: default
      labels:
        app.kubernetes.io/name: "{{ .Release.Name }}"
        app.kubernetes.io/version: "1.0"
        app.kubernetes.io/instance: t
    spec:
      hostname: "{{ .Release.Name }}.nebari.local"
      service:
        name: "svc-{{ .Release.Name }}"
        port: '{{ .Values.cases.minimal.spec.service.port }}'
      auth:
        enabled: true
        provider: keycloak
        provisionClient: true
        enforceAtGateway: false
        redirectURI: /*
        scopes:
          - openid
          - '{{ "PROFILE" | lower }}'
          - email
      routing:
        routes: '{{ $routes := list }}{{ range (list "/" "/api") }}{{ $routes = append $routes (dict "pathPrefix" . "pathType" "PathPrefix") }}{{ end }}{{ $routes | toJson }}'
      landingPage:
        enabled: true
        displayName: "{{ .Release.Name | title }} App"
        description: "App for {{ .Release.Name }}"
        category: testing
        priority: 1
        healthCheck:
          enabled: true
          path: /health
