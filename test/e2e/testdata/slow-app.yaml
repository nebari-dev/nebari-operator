# A backend that answers as slowly as the request asks, for the route
# timeouts specs. ?s=N waits N seconds before answering. ?stream=N answers
# at once and then sends one line a second for N seconds, so only the body
# outlasts a timeout.
#
# slow-app serves it directly. slow-proxied puts a reverse-proxy sidecar
# (oauth2-proxy) in front of it, the way apps that run their own auth proxy
# are deployed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: slow-app
  namespace: NAMESPACE_PLACEHOLDER
data:
  server.py: |
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs, urlparse


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            query = parse_qs(urlparse(self.path).query)
            try:
                if "stream" in query:
                    self.stream(int(query["stream"][0]))
                else:
                    self.answer(float(query.get("s", ["0"])[0]))
            except (BrokenPipeError, ConnectionResetError):
                pass

        def answer(self, seconds):
            time.sleep(seconds)
            body = ("ok %s\n" % self.path).encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def stream(self, seconds):
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Transfer-Encoding", "chunked")
            self.end_headers()
            for i in range(seconds):
                line = ("line %d\n" % (i + 1)).encode()
                self.wfile.write(b"%x\r\n%s\r\n" % (len(line), line))
                self.wfile.flush()
                time.sleep(1)
            self.wfile.write(b"0\r\n\r\n")


    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-app
  namespace: NAMESPACE_PLACEHOLDER
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-app
  template:
    metadata:
      labels:
        app: slow-app
    spec:
      containers:
      - name: server
        image: python:3.13-alpine
        command: ["python", "-u", "/srv/server.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code
          mountPath: /srv
      volumes:
      - name: code
        configMap:
          name: slow-app
---
apiVersion: v1
kind: Service
metadata:
  name: slow-app
  namespace: NAMESPACE_PLACEHOLDER
spec:
  selector:
    app: slow-app
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-proxied
  namespace: NAMESPACE_PLACEHOLDER
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-proxied
  template:
    metadata:
      labels:
        app: slow-proxied
    spec:
      containers:
      - name: server
        image: python:3.13-alpine
        command: ["python", "-u", "/srv/server.py"]
        volumeMounts:
        - name: code
          mountPath: /srv
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
        args:
        - --http-address=0.0.0.0:4180
        - --upstream=http://127.0.0.1:8080/
        # The gateway does the login in these specs, so the proxy only proxies.
        - --skip-auth-regex=^/
        - --provider=github
        - --client-id=e2e
        - --client-secret=e2e
        - --cookie-secret=0123456789abcdef0123456789abcdef
        - --email-domain=*
        # The proxy has its own limit on waiting for the app's response
        # headers (30s by default). A route timeout longer than that only
        # helps if the proxy's limit is raised too.
        - --upstream-timeout=120s
        ports:
        - containerPort: 4180
      volumes:
      - name: code
        configMap:
          name: slow-app
---
apiVersion: v1
kind: Service
metadata:
  name: slow-proxied
  namespace: NAMESPACE_PLACEHOLDER
spec:
  selector:
    app: slow-proxied
  ports:
  - port: 4180
    targetPort: 4180
