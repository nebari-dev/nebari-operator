# App-owned login: the app is its own OIDC client (JupyterHub's shape). The
# operator provisions the client and its Secret but creates no SecurityPolicy,
# and the app reads client-id and client-secret from <name>-oidc-client.
# workload.yaml stands in for the app with oauth2-proxy.
apiVersion: reconcilers.nebari.dev/v1
kind: NebariApp
metadata:
  name: app-login
  namespace: NAMESPACE_PLACEHOLDER
spec:
  hostname: app-login.contract.nebari.local
  service:
    name: app-login
    port: 4180
  routing:
    routes:
      - pathPrefix: /
  auth:
    enabled: true
    provider: keycloak
    provisionClient: true
    enforceAtGateway: false
    forwardAccessToken: false
    redirectURI: /hub/oauth/callback
    scopes:
      - openid
      - profile
      - email
      - groups
