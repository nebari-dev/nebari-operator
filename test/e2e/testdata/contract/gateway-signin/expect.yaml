# What each persona gets from gateway-signin. Outcomes are "login" (redirected
# to the Keycloak sign-in page) or the HTTP status. See ../README.md.
paths:
  /:
    anonymous: login
    no-group: 200
    team-a: 200
    team-a-sub: 200
    team-b: 200
  /healthz:
    anonymous: 200
    no-group: 200
    team-a: 200
    team-a-sub: 200
    team-b: 200

# Claims of the access token the app receives on this path. null means the
# claim must be absent.
claims:
  path: /
  personas:
    no-group:
      azp: e2e-contract-gateway-signin
      groups: null
    team-a:
      azp: e2e-contract-gateway-signin
      groups: [/ct-team-a]
    team-a-sub:
      azp: e2e-contract-gateway-signin
      groups: [/ct-team-a/sub]
    team-b:
      azp: e2e-contract-gateway-signin
      groups: [/ct-team-b]
