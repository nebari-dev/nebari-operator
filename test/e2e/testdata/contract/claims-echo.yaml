# Backend shared by the contract sample apps. It answers every request with
# the claims of the access token it received, so the matrix can check what an
# app actually sees: the gateway forwards the token as "Authorization: Bearer",
# and oauth2-proxy as "X-Forwarded-Access-Token". The token is decoded, not
# verified: the gateway or the proxy in front of it has already done that.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-echo
  namespace: NAMESPACE_PLACEHOLDER
data:
  server.py: |
    import base64
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


    def decode(token):
        try:
            payload = token.split(".")[1]
            payload += "=" * (-len(payload) % 4)
            return json.loads(base64.urlsafe_b64decode(payload))
        except Exception:
            return {"error": "token is not a JWT"}


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            source, token = "none", None
            auth = self.headers.get("Authorization", "")
            if auth.startswith("Bearer "):
                source, token = "authorization", auth[len("Bearer "):]
            elif self.headers.get("X-Forwarded-Access-Token"):
                source, token = "x-forwarded-access-token", self.headers["X-Forwarded-Access-Token"]
            body = json.dumps(
                {"path": self.path, "token": source, "claims": decode(token) if token else None},
                separators=(",", ":"),
            ).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-echo
  namespace: NAMESPACE_PLACEHOLDER
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-echo
  template:
    metadata:
      labels:
        app: claims-echo
    spec:
      containers:
        - name: echo
          image: python:3.13-alpine
          command: ["python", "-u", "/app/server.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: claims-echo
---
apiVersion: v1
kind: Service
metadata:
  name: claims-echo
  namespace: NAMESPACE_PLACEHOLDER
spec:
  selector:
    app: claims-echo
  ports:
    - port: 8080
      targetPort: 8080
