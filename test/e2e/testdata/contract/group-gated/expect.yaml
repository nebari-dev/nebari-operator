# What each persona gets from group-gated, which admits /ct-team-a only.
# See ../README.md.
paths:
  /:
    anonymous: login
    no-group: 403
    team-a: 200
    # Membership is matched exactly: a subgroup member is not a member of
    # the parent.
    team-a-sub: 403
    team-b: 403
  /healthz:
    anonymous: 200
    no-group: 200
    team-a: 200
    team-a-sub: 200
    team-b: 200
