# Minimal stand-in for the CloudNativePG Cluster CRD, for envtest only.
# The github.com/cloudnative-pg/api module ships Go types but no CRD manifests,
# and the database reconciler only needs the API server to store Clusters and
# serve their status subresource. The schema is deliberately open: CNPG's own
# validation is not what these tests exercise.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.postgresql.cnpg.io
spec:
  group: postgresql.cnpg.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
