# This rule is not used by the project nebari-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over lifecycle.nebari.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nebari-operator
    app.kubernetes.io/managed-by: kustomize
  name: lifecycle-usercleanuphook-admin-role
rules:
- apiGroups:
  - lifecycle.nebari.dev
  resources:
  - usercleanuphooks
  verbs:
  - '*'
- apiGroups:
  - lifecycle.nebari.dev
  resources:
  - usercleanuphooks/status
  verbs:
  - get
