# This rule is not used by the project nebari-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the lifecycle.nebari.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nebari-operator
    app.kubernetes.io/managed-by: kustomize
  name: lifecycle-usercleanuphook-editor-role
rules:
- apiGroups:
  - lifecycle.nebari.dev
  resources:
  - usercleanuphooks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - lifecycle.nebari.dev
  resources:
  - usercleanuphooks/status
  verbs:
  - get
