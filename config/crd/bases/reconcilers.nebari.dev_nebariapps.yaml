---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: nebariapps.reconcilers.nebari.dev
spec:
  group: reconcilers.nebari.dev
  names:
    kind: NebariApp
    listKind: NebariAppList
    plural: nebariapps
    shortNames:
    - nebariapp
    singular: nebariapp
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          NebariApp is the Schema for the nebariapps API
          It represents an application onboarding intent, specifying how an application
          should be exposed (routing), secured (TLS), and protected (authentication).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of NebariApp
            properties:
              auth:
                description: |-
                  Auth configures authentication/authorization for the application.
                  When enabled, the application will require OIDC authentication via supporting OIDC Provider.
                properties:
                  clientSecretRef:
                    description: |-
                      ClientSecretRef references a Kubernetes Secret containing OIDC client credentials.
                      The secret must be in the same namespace as the NebariApp and contain:
                        - client-id: The OIDC client ID
                        - client-secret: The OIDC client secret
                      If not specified and ProvisionClient is enabled, the operator will create
                      a secret named "<nebariapp-name>-oidc-client".
                    type: string
                  denyRedirect:
                    description: |-
                      DenyRedirect configures headers that, when matched, prevent the OIDC filter
                      from redirecting to the identity provider. Instead, matching requests receive
                      a 401 response. This prevents PKCE race conditions when SPAs fire multiple
                      requests on page load (e.g., the main page and AJAX calls simultaneously),
                      each of which would otherwise start a separate OAuth flow and overwrite
                      each other's state cookies.
                      Only applies when enforceAtGateway is true.
                    items:
                      description: |-
                        DenyRedirectHeader defines a header match rule for preventing OIDC redirects.
                        Requests matching any of these headers will receive a 401 instead of being
                        redirected to the identity provider.
                      properties:
                        name:
                          description: Name is the header name to match against.
                          minLength: 1
                          type: string
                        type:
                          default: Exact
                          description: |-
                            Type specifies how to match the header value.
                            Valid values: Exact, Prefix, Suffix, RegularExpression
                          enum:
                          - Exact
                          - Prefix
                          - Suffix
                          - RegularExpression
                          type: string
                        value:
                          description: Value is the header value to match.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  deviceFlowClient:
                    description: |-
                      DeviceFlowClient configures a public OIDC client for CLI/native app authentication
                      using the OAuth2 Device Authorization Grant (RFC 8628).
                      When enabled, the operator provisions a separate public client configured for device flow.
                      The device flow client ID is written to the OIDC client Secret under key "device-client-id".
                      Only supported for provider="keycloak".
                    properties:
                      enabled:
                        default: false
                        description: |-
                          Enabled determines whether a public OIDC client should be provisioned for device flow.
                          When true, the operator creates a Keycloak client configured with:
                            - publicClient: true (no secret needed for CLI usage)
                            - OAuth2 Device Authorization Grant enabled
                            - standardFlowEnabled: false
                          The device flow client ID is written to the OIDC secret for runtime consumption.
                        type: boolean
                    type: object
                  enabled:
                    default: false
                    description: |-
                      Enabled determines whether authentication should be enforced for this application.
                      When true, users must authenticate via OIDC before accessing the application.
                    type: boolean
                  enforceAtGateway:
                    default: true
                    description: |-
                      EnforceAtGateway determines whether the operator should create an Envoy Gateway
                      SecurityPolicy to enforce authentication at the gateway level.
                      When true (default), the operator creates a SecurityPolicy that handles
                      the OIDC flow at the gateway before requests reach the application.
                      When false, the operator provisions the OIDC client and stores credentials
                      in a Secret, but does NOT create a SecurityPolicy - the application is
                      expected to handle OAuth natively (e.g., Grafana's built-in generic_oauth).
                      This is the correct switch for "no gateway-level auth"; do not try to
                      achieve that by listing every path under routing.publicRoutes, which
                      instead produces overlapping protected and unprotected routes for the same
                      path (see PublicRoutes).
                    type: boolean
                  forwardAccessToken:
                    description: |-
                      ForwardAccessToken instructs the gateway-enforced OIDC filter to forward
                      the user's OAuth2 access token to the upstream service via the
                      `Authorization: Bearer <token>` header. Use this when the application
                      needs to read the JWT itself - for example to extract the user's groups
                      claim and apply per-user authorization decisions on top of the gateway's
                      authentication. By default the gateway only stores the token in an
                      encrypted session cookie that backends cannot decode.
                      Only applies when enforceAtGateway is true.
                    type: boolean
                  groups:
                    description: |-
                      Groups specifies the list of groups that should have access to this application.
                      When specified, only users belonging to these groups will be authorized.
                      Group matching is case-sensitive and depends on the OIDC provider's group claim.
                    items:
                      type: string
                    type: array
                  issuerURL:
                    description: |-
                      IssuerURL specifies the OIDC issuer URL for generic-oidc provider.
                      Required when provider="generic-oidc", ignored for other providers.
                      Example: https://accounts.google.com, https://login.microsoftonline.com/<tenant>/v2.0
                    type: string
                  keycloakConfig:
                    description: |-
                      KeycloakConfig provides Keycloak-specific configuration for fine-grained control
                      over realm resources like groups, client scopes, and protocol mappers.
                      Only used when provider="keycloak" and provisionClient=true; silently ignored
                      for other providers (e.g., generic-oidc).
                    properties:
                      groups:
                        description: |-
                          Groups defines Keycloak groups to ensure exist in the realm,
                          with optional user membership assignments.
                        items:
                          description: KeycloakGroup defines a Keycloak group to create
                            in the realm with optional member assignments.
                          properties:
                            members:
                              description: |-
                                Members is a list of Keycloak usernames that should be members of this group.
                                Membership sync is additive-only: users in this list will be added to the group,
                                but existing group members not in this list will NOT be removed.
                                Users that don't exist in Keycloak will be logged as warnings but won't cause errors.
                              items:
                                type: string
                              type: array
                            name:
                              description: Name is the group name to create in Keycloak.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      protocolMappers:
                        description: |-
                          ProtocolMappers defines client-level protocol mappers to configure on the
                          OIDC client. These are applied directly to the client (not to shared client
                          scopes), so each NebariApp gets isolated mapper configuration.
                          When specified, the operator's default mappers (e.g., group-membership) are
                          not auto-created - the user's configuration takes full control.
                        items:
                          description: KeycloakProtocolMapperConfig defines a protocol
                            mapper with arbitrary configuration.
                          properties:
                            config:
                              additionalProperties:
                                type: string
                              description: |-
                                Config is the mapper configuration as arbitrary key-value pairs.
                                Keys and values are specific to the mapper type.
                                Example for group-membership mapper: {"claim.name": "groups", "full.path": "false"}
                              type: object
                            name:
                              description: Name of the protocol mapper.
                              minLength: 1
                              type: string
                            protocolMapper:
                              description: |-
                                ProtocolMapper is the mapper type identifier.
                                Example: "oidc-group-membership-mapper", "oidc-usermodel-attribute-mapper"
                              minLength: 1
                              type: string
                          required:
                          - name
                          - protocolMapper
                          type: object
                        type: array
                    type: object
                  provider:
                    default: keycloak
                    description: |-
                      Provider specifies the OIDC authentication provider to use.
                      Supported values: keycloak, generic-oidc
                    enum:
                    - keycloak
                    - generic-oidc
                    type: string
                  provisionClient:
                    default: true
                    description: |-
                      ProvisionClient determines whether the operator should automatically provision
                      an OIDC client in the provider. When true, the operator will create a client
                      (e.g., in Keycloak) and store the credentials in a Secret.
                      Only supported for provider="keycloak".
                      Defaults to true if not specified.
                    type: boolean
                  redirectURI:
                    description: |-
                      RedirectURI specifies the OAuth2 callback path for the application.
                      If not specified, defaults to "/oauth2/callback" which is the Envoy Gateway default.
                      For application-level auth handling, specify the app's callback path (e.g., "/auth/callback").
                      The full redirect URL will be: https://<hostname><redirectURI>
                    type: string
                  scopes:
                    description: |-
                      Scopes defines the OIDC scopes to request during authentication.
                      Common scopes: openid, profile, email, roles, groups
                      If not specified, defaults to: ["openid", "profile", "email"]
                    items:
                      type: string
                    type: array
                  spaClient:
                    description: |-
                      SPAClient configures a public OIDC client for browser-based authentication.
                      When enabled, the operator provisions a separate public client for Single-Page
                      Applications that use PKCE flows (e.g., React apps with keycloak-js).
                      This is distinct from the confidential client used for server-side auth (oauth2-proxy).
                      The public client is configured with:
                        - publicClient: true (no client secret, safe for browser)
                        - Redirect URIs: https://<hostname>/* and https://<hostname>
                        - PKCE enforcement (S256)
                      Only supported for provider="keycloak".
                    properties:
                      clientId:
                        description: |-
                          ClientID optionally overrides the generated client ID for the SPA client.
                          If not specified, defaults to: <namespace>-<name>-spa
                          This allows custom client naming for organizational conventions.
                        type: string
                      enabled:
                        default: false
                        description: |-
                          Enabled determines whether a public OIDC client should be provisioned for SPA use.
                          When true, the operator creates a second Keycloak client configured as:
                            - publicClient: true (no client secret, safe for browser)
                            - Redirect URIs: https://<hostname>/* and https://<hostname>
                            - PKCE enforcement with S256 code challenge method
                          The public client ID will be written to a ConfigMap or the OIDC secret for
                          runtime consumption by the frontend application.
                        type: boolean
                    type: object
                  tokenExchange:
                    description: |-
                      TokenExchange configures OAuth 2.0 Token Exchange (RFC 8693) for this client.
                      When enabled, other NebariApp OIDC clients in the same Keycloak realm can
                      exchange their access tokens for tokens with this client's audience.
                      Requires KC_FEATURES=token-exchange on the Keycloak server.
                      Only supported for provider="keycloak".
                    properties:
                      enabled:
                        default: false
                        description: |-
                          Enabled determines whether token exchange should be configured for this client.
                          When true, the operator enables authorization services on the Keycloak client
                          and creates policies allowing all other NebariApp clients in the same realm
                          to exchange tokens for this client's audience.
                        type: boolean
                    type: object
                type: object
                x-kubernetes-validations:
                - message: 'forwardAccessToken: true requires enforceAtGateway: true'
                  rule: '!has(self.forwardAccessToken) || self.forwardAccessToken
                    == false || (has(self.enforceAtGateway) && self.enforceAtGateway
                    == true)'
              gateway:
                default: public
                description: |-
                  Gateway specifies which shared Gateway to use for routing.
                  Valid values are "public" (default) or "internal".
                enum:
                - public
                - internal
                type: string
              hostname:
                description: |-
                  Hostname is the fully qualified domain name where the application should be accessible.
                  This will be used to generate HTTPRoute.
                  Example: "myapp.nebari.local" or "api.example.com"
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              landingPage:
                description: |-
                  LandingPage configures how this service appears on the Nebari landing page.
                  When enabled, the service will be discoverable through the landing page portal.
                properties:
                  category:
                    description: |-
                      Category groups related services together on the landing page.
                      Common categories: Development, Monitoring, Platform, Data Science
                    type: string
                  description:
                    description: |-
                      Description provides additional context about the service.
                      Shown as supplementary text on the service card.
                    maxLength: 256
                    type: string
                  displayName:
                    description: |-
                      DisplayName is the human-readable name shown on the landing page.
                      Required when Enabled is true.
                    maxLength: 64
                    type: string
                  enabled:
                    default: false
                    description: |-
                      Enabled determines if this service appears on the landing page.
                      When false, the service is not shown on the landing page.
                    type: boolean
                  externalUrl:
                    description: |-
                      ExternalUrl overrides the default URL derived from the hostname.
                      Use this when the service URL differs from https://<hostname>
                    type: string
                  healthCheck:
                    description: HealthCheck configures health status monitoring for
                      this service.
                    properties:
                      enabled:
                        default: false
                        description: Enabled determines if health checks are performed.
                        type: boolean
                      intervalSeconds:
                        default: 30
                        description: IntervalSeconds is how often to perform health
                          checks (in seconds).
                        maximum: 300
                        minimum: 10
                        type: integer
                      path:
                        default: /health
                        description: |-
                          Path is the HTTP path to check for health status.
                          Common paths: /health, /healthz, /api/health
                        type: string
                      port:
                        description: |-
                          Port is the port number to use for health checks.
                          If not specified, defaults to the service port defined in spec.service.port.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      timeoutSeconds:
                        default: 5
                        description: TimeoutSeconds is the request timeout for health
                          checks (in seconds).
                        maximum: 30
                        minimum: 1
                        type: integer
                    required:
                    - enabled
                    type: object
                  icon:
                    description: |-
                      Icon is an identifier for the service icon (e.g., "jupyter", "grafana")
                      or a URL to a custom icon image. Shown in both light and dark mode when
                      IconLight/IconDark are not set.
                      Supported built-in icons: jupyter, grafana, prometheus, keycloak, argocd, kubernetes
                    type: string
                  iconDark:
                    description: |-
                      IconDark is the URL of the icon to display when the UI is in dark mode.
                      Takes precedence over Icon in dark mode.
                    type: string
                  iconLight:
                    description: |-
                      IconLight is the URL of the icon to display when the UI is in light mode.
                      Takes precedence over Icon in light mode.
                    type: string
                  priority:
                    default: 100
                    description: |-
                      Priority determines sort order within a category (lower number = higher priority).
                      Services are displayed in ascending priority order within each category.
                    maximum: 1000
                    minimum: 0
                    type: integer
                required:
                - enabled
                type: object
              routing:
                description: Routing configures routing behavior including path-based
                  rules and TLS.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations defines additional annotations to merge onto the generated HTTPRoute.
                      Useful for tools like ArgoCD that track resources via annotations
                      (e.g. argocd.argoproj.io/tracking-id).
                      These annotations are merged with any operator-managed annotations; operator
                      annotations always take precedence to avoid breaking internal behaviour.
                    type: object
                  filters:
                    description: |-
                      Filters are appended, in order, to every HTTPRouteRule the operator
                      generates for this NebariApp (both the protected route and the public
                      route built from publicRoutes). This is a pass-through to the upstream
                      gateway.networking.k8s.io/v1 HTTPRouteFilter spec, mirroring the
                      Annotations escape hatch: the operator does not interpret, reorder, or
                      strip the filters, it only forwards them. Use it to adjust request or
                      response headers at the gateway (for example, stripping an overpermissive
                      CORS header an upstream sets, or adding security headers) without forking
                      the operator or rebuilding the backend image.
                    items:
                      description: |-
                        HTTPRouteFilter defines processing steps that must be completed during the
                        request or response lifecycle. HTTPRouteFilters are meant as an extension
                        point to express processing that may be done in Gateway implementations. Some
                        examples include request or response modification, implementing
                        authentication strategies, rate-limiting, and traffic shaping. API
                        guarantee/conformance is defined based on the type of the filter.

                        <gateway:experimental:validation:XValidation:message="filter.cors must be nil if the filter.type is not CORS",rule="!(has(self.cors) && self.type != 'CORS')">
                        <gateway:experimental:validation:XValidation:message="filter.cors must be specified for CORS filter.type",rule="!(!has(self.cors) && self.type == 'CORS')">
                        <gateway:experimental:validation:XValidation:message="filter.externalAuth must be nil if the filter.type is not ExternalAuth",rule="!(has(self.externalAuth) && self.type != 'ExternalAuth')">
                        <gateway:experimental:validation:XValidation:message="filter.externalAuth must be specified for ExternalAuth filter.type",rule="!(!has(self.externalAuth) && self.type == 'ExternalAuth')">
                      properties:
                        cors:
                          description: |-
                            CORS defines a schema for a filter that responds to the
                            cross-origin request based on HTTP response header.

                            Support: Extended

                            <gateway:experimental>
                          properties:
                            allowCredentials:
                              description: |-
                                AllowCredentials indicates whether the actual cross-origin request allows
                                to include credentials.

                                When set to true, the gateway will include the `Access-Control-Allow-Credentials`
                                response header with value true (case-sensitive).

                                When set to false or omitted the gateway will omit the header
                                `Access-Control-Allow-Credentials` entirely (this is the standard CORS
                                behavior).

                                Support: Extended
                              type: boolean
                            allowHeaders:
                              description: |-
                                AllowHeaders indicates which HTTP request headers are supported for
                                accessing the requested resource.

                                Header names are not case sensitive.

                                Multiple header names in the value of the `Access-Control-Allow-Headers`
                                response header are separated by a comma (",").

                                When the `AllowHeaders` field is configured with one or more headers, the
                                gateway must return the `Access-Control-Allow-Headers` response header
                                which value is present in the `AllowHeaders` field.

                                If any header name in the `Access-Control-Request-Headers` request header
                                is not included in the list of header names specified by the response
                                header `Access-Control-Allow-Headers`, it will present an error on the
                                client side.

                                If any header name in the `Access-Control-Allow-Headers` response header
                                does not recognize by the client, it will also occur an error on the
                                client side.

                                A wildcard indicates that the requests with all HTTP headers are allowed.
                                The `Access-Control-Allow-Headers` response header can only use `*`
                                wildcard as value when the `AllowCredentials` field is false or omitted.

                                When the `AllowCredentials` field is true and `AllowHeaders` field
                                specified with the `*` wildcard, the gateway must specify one or more
                                HTTP headers in the value of the `Access-Control-Allow-Headers` response
                                header. The value of the header `Access-Control-Allow-Headers` is same as
                                the `Access-Control-Request-Headers` header provided by the client. If
                                the header `Access-Control-Request-Headers` is not included in the
                                request, the gateway will omit the `Access-Control-Allow-Headers`
                                response header, instead of specifying the `*` wildcard. A Gateway
                                implementation may choose to add implementation-specific default headers.

                                Support: Extended
                              items:
                                description: |-
                                  HTTPHeaderName is the name of an HTTP header.

                                  Valid values include:

                                  * "Authorization"
                                  * "Set-Cookie"

                                  Invalid values include:

                                    - ":method" - ":" is an invalid character. This means that HTTP/2 pseudo
                                      headers are not currently supported by this type.
                                    - "/invalid" - "/ " is an invalid character
                                maxLength: 256
                                minLength: 1
                                pattern: ^[A-Za-z0-9!#$%&'*+\-.^_\x60|~]+$
                                type: string
                              maxItems: 64
                              type: array
                              x-kubernetes-list-type: set
                            allowMethods:
                              description: |-
                                AllowMethods indicates which HTTP methods are supported for accessing the
                                requested resource.

                                Valid values are any method defined by RFC9110, along with the special
                                value `*`, which represents all HTTP methods are allowed.

                                Method names are case sensitive, so these values are also case-sensitive.
                                (See https://www.rfc-editor.org/rfc/rfc2616#section-5.1.1)

                                Multiple method names in the value of the `Access-Control-Allow-Methods`
                                response header are separated by a comma (",").

                                A CORS-safelisted method is a method that is `GET`, `HEAD`, or `POST`.
                                (See https://fetch.spec.whatwg.org/#cors-safelisted-method) The
                                CORS-safelisted methods are always allowed, regardless of whether they
                                are specified in the `AllowMethods` field.

                                When the `AllowMethods` field is configured with one or more methods, the
                                gateway must return the `Access-Control-Allow-Methods` response header
                                which value is present in the `AllowMethods` field.

                                If the HTTP method of the `Access-Control-Request-Method` request header
                                is not included in the list of methods specified by the response header
                                `Access-Control-Allow-Methods`, it will present an error on the client
                                side.

                                The `Access-Control-Allow-Methods` response header can only use `*`
                                wildcard as value when the `AllowCredentials` field is false or omitted.

                                When the `AllowCredentials` field is true and `AllowMethods` field
                                specified with the `*` wildcard, the gateway must specify one HTTP method
                                in the value of the Access-Control-Allow-Methods response header. The
                                value of the header `Access-Control-Allow-Methods` is same as the
                                `Access-Control-Request-Method` header provided by the client. If the
                                header `Access-Control-Request-Method` is not included in the request,
                                the gateway will omit the `Access-Control-Allow-Methods` response header,
                                instead of specifying the `*` wildcard. A Gateway implementation may
                                choose to add implementation-specific default methods.

                                Support: Extended
                              items:
                                enum:
                                - GET
                                - HEAD
                                - POST
                                - PUT
                                - DELETE
                                - CONNECT
                                - OPTIONS
                                - TRACE
                                - PATCH
                                - '*'
                                type: string
                              maxItems: 9
                              type: array
                              x-kubernetes-list-type: set
                              x-kubernetes-validations:
                              - message: AllowMethods cannot contain '*' alongside
                                  other methods
                                rule: '!(''*'' in self && self.size() > 1)'
                            allowOrigins:
                              description: |-
                                AllowOrigins indicates whether the response can be shared with requested
                                resource from the given `Origin`.

                                The `Origin` consists of a scheme and a host, with an optional port, and
                                takes the form `<scheme>://<host>(:<port>)`.

                                Valid values for scheme are: `http` and `https`.

                                Valid values for port are any integer between 1 and 65535 (the list of
                                available TCP/UDP ports). Note that, if not included, port `80` is
                                assumed for `http` scheme origins, and port `443` is assumed for `https`
                                origins. This may affect origin matching.

                                The host part of the origin may contain the wildcard character `*`. These
                                wildcard characters behave as follows:

                                * `*` is a greedy match to the _left_, including any number of
                                  DNS labels to the left of its position. This also means that
                                  `*` will include any number of period `.` characters to the
                                  left of its position.
                                * A wildcard by itself matches all hosts.

                                An origin value that includes _only_ the `*` character indicates requests
                                from all `Origin`s are allowed.

                                When the `AllowOrigins` field is configured with multiple origins, it
                                means the server supports clients from multiple origins. If the request
                                `Origin` matches the configured allowed origins, the gateway must return
                                the given `Origin` and sets value of the header
                                `Access-Control-Allow-Origin` same as the `Origin` header provided by the
                                client.

                                The status code of a successful response to a "preflight" request is
                                always an OK status (i.e., 204 or 200).

                                If the request `Origin` does not match the configured allowed origins,
                                the gateway returns 204/200 response but doesn't set the relevant
                                cross-origin response headers. Alternatively, the gateway responds with
                                403 status to the "preflight" request is denied, coupled with omitting
                                the CORS headers. The cross-origin request fails on the client side.
                                Therefore, the client doesn't attempt the actual cross-origin request.

                                The `Access-Control-Allow-Origin` response header can only use `*`
                                wildcard as value when the `AllowCredentials` field is false or omitted.

                                When the `AllowCredentials` field is true and `AllowOrigins` field
                                specified with the `*` wildcard, the gateway must return a single origin
                                in the value of the `Access-Control-Allow-Origin` response header,
                                instead of specifying the `*` wildcard. The value of the header
                                `Access-Control-Allow-Origin` is same as the `Origin` header provided by
                                the client.

                                Support: Extended
                              items:
                                description: |-
                                  The CORSOrigin MUST NOT be a relative URI, and it MUST follow the URI syntax and
                                  encoding rules specified in RFC3986.  The CORSOrigin MUST include both a
                                  scheme (e.g., "http" or "spiffe") and a scheme-specific-part, or it should be a single '*' character.
                                  URIs that include an authority MUST include a fully qualified domain name or
                                  IP address as the host.
                                  <gateway:util:excludeFromCRD> The below regex was generated to simplify the assertion of scheme://host:<port> being port optional </gateway:util:excludeFromCRD>
                                maxLength: 253
                                minLength: 1
                                pattern: (^\*$)|(^([a-zA-Z][a-zA-Z0-9+\-.]+):\/\/([^:/?#]+)(:([0-9]{1,5}))?$)
                                type: string
                              maxItems: 64
                              type: array
                              x-kubernetes-list-type: set
                              x-kubernetes-validations:
                              - message: AllowOrigins cannot contain '*' alongside
                                  other origins
