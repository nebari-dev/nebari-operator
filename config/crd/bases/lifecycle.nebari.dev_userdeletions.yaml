---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: userdeletions.lifecycle.nebari.dev
spec:
  group: lifecycle.nebari.dev
  names:
    kind: UserDeletion
    listKind: UserDeletionList
    plural: userdeletions
    singular: userdeletion
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.username
      name: Username
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.deletedAt
      name: Deleted
      type: date
    - jsonPath: .status.dueAt
      name: Due
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          UserDeletion marks that a user was deleted in Keycloak. The poller creates one per
          deleted user and the UserDeletion controller runs the registered cleanup hooks for it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of UserDeletion
            properties:
              adminEventId:
                description: adminEventId is the id of the Keycloak admin event this
                  deletion was created from.
                type: string
              deletedAt:
                description: deletedAt is when the user was deleted in Keycloak. The
                  grace period counts from here.
                format: date-time
                type: string
              deletedBy:
                description: deletedBy identifies who performed the deletion. For
                  audit only.
                properties:
                  clientId:
                    description: clientId is the Keycloak client the deletion was
                      made through.
                    type: string
                  ipAddress:
                    description: ipAddress is the address the deletion request came
                      from.
                    type: string
                  userId:
                    description: userId is the Keycloak id of the admin who deleted
                      the user. Not the deleted user.
                    type: string
                type: object
              userId:
                description: |-
                  userId is the Keycloak id of the deleted user, same as the OIDC sub claim.
                  It is also the name of this object.
                type: string
              username:
                description: username is the deleted user's username. Empty when the
                  Keycloak event did not carry it.
                type: string
            required:
            - deletedAt
            - userId
            type: object
          status:
            description: status defines the observed state of UserDeletion
            properties:
              completedAt:
                description: |-
                  completedAt is when every hook entry became terminal. The tombstone is
                  removed some time after this.
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions:
                  - "IdentifiersComplete": the username is known. False when the Keycloak
                    event carried no representation, so packs keyed on username may do nothing.
                  - "HooksSucceeded": every hook entry is terminal and none failed or was skipped.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dueAt:
                description: |-
                  dueAt is when the "delete" stage may run: deletedAt plus the cluster-wide
                  grace period at the time the marker was first reconciled. It is frozen so
                  a later change to the grace period does not move markers already in flight.
                format: date-time
                type: string
              hooks:
                description: hooks has one entry per UserCleanupHook seen while this
                  deletion was in flight.
                items:
                  description: HookStatus records the cleanup of one UserCleanupHook
                    for this user.
                  properties:
                    finishedAt:
                      description: finishedAt is when the Job reached a terminal state,
                        or when the entry was skipped.
                      format: date-time
                      type: string
                    firstFailedAt:
                      description: |-
                        firstFailedAt is when creating the Job first failed for a reason that may
                        clear on its own. Retries continue for a bounded window from this time,
                        then the entry becomes Failed. Cleared when a create succeeds.
                      format: date-time
                      type: string
                    job:
                      description: job is the name of the Job created for this hook,
                        once created.
                      type: string
                    message:
                      description: message is a human readable explanation to go with
                        reason.
                      type: string
                    name:
                      description: name of the UserCleanupHook.
                      type: string
                    namespace:
                      description: namespace of the UserCleanupHook. Jobs run there.
                      type: string
                    reason:
                      description: |-
                        reason is a CamelCase word explaining a Failed or Skipped state, or why a
                        Pending entry has not advanced, for example a Job create that keeps failing.
                      type: string
                    stage:
                      description: stage the hook subscribed to, copied so the entry
                        stays meaningful after the hook is gone.
                      enum:
                      - disable
                      - delete
                      type: string
                    startedAt:
                      description: startedAt is when the Job started.
                      format: date-time
                      type: string
                    state:
                      description: state of the cleanup.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      - Skipped
                      type: string
                  required:
                  - name
                  - namespace
                  - stage
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - namespace
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation this status
                  was computed from.
                format: int64
                type: integer
              phase:
                description: 'phase summarizes the cleanup: Pending, InProgress or
                  Completed.'
                enum:
                - Pending
                - InProgress
                - Completed
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
