<svg xmlns="http://www.w3.org/2000/svg" width="960" height="664" viewBox="0 0 960 664" font-family="Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="probe.sh, signed in as ct-team-a, requests the group-gated app through Envoy Gateway. The gateway sends the user to sign in at Keycloak and gets them back signed in, then forwards the request and the token to claims-echo, which replies 200 with the token's claims. The result is compared with expect.yaml: a match passes, and a difference fails the spec with every differing cell listed.">
<title>How one cell of the contract matrix is checked</title>
<defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.7" flood-color="#0b5f52" flood-opacity="0.18"/></filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5 z" fill="#0E8C79"/></marker>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5 z" fill="#8aa39c"/></marker>
  </defs>
<rect width="960" height="664" fill="#fbfcfc" rx="12"/>
<text x="40" y="36" font-size="10.5" font-weight="700" fill="#8aa39c" text-anchor="start" letter-spacing="1.6">HOW ONE CELL IS CHECKED</text>
<text x="920" y="36" font-size="11" font-weight="500" fill="#8aa39c" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">test/e2e/contract_test.go</text>
<rect x="40" y="60" width="500" height="64" rx="10" fill="#e6edf6" stroke="#2f5a8a" stroke-width="1.5" filter="url(#sh)"/>
<text x="58" y="87" font-size="14" font-weight="700" fill="#16302b" text-anchor="start">probe.sh, signed in as ct-team-a</text>
<text x="58" y="108" font-size="11.5" font-weight="400" fill="#5f716c" text-anchor="start">a curl pod inside the cluster</text>
<path d="M290.0,128 L290.0,166" fill="none" stroke="#0E8C79" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="304.0" y="151.0" font-size="11.5" font-weight="400" fill="#5f716c" text-anchor="start">requests / on group-gated through</text>
<rect x="40" y="172" width="500" height="64" rx="10" fill="#dff3ef" stroke="#0E8C79" stroke-width="1.5" filter="url(#sh)"/>
<text x="58" y="199" font-size="14" font-weight="700" fill="#16302b" text-anchor="start">Envoy Gateway</text>
<text x="58" y="220" font-size="11.5" font-weight="400" fill="#5f716c" text-anchor="start">SecurityPolicy the operator built from the app's NebariApp</text>
<rect x="680" y="172" width="240" height="64" rx="10" fill="#dff3ef" stroke="#0E8C79" stroke-width="1.5" filter="url(#sh)"/>
<text x="698" y="199" font-size="14" font-weight="700" fill="#16302b" text-anchor="start">Keycloak</text>
<text x="698" y="220" font-size="11.5" font-weight="400" fill="#5f716c" text-anchor="start">nebari realm, real sign-in form</text>
<path d="M544,194 L674,194" fill="none" stroke="#0E8C79" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="610.0" y="186" font-size="11" font-weight="400" fill="#5f716c" text-anchor="middle">sends the user to sign in</text>
<path d="M676,216 L546,216" fill="none" stroke="#0E8C79" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="610.0" y="234" font-size="11" font-weight="400" fill="#5f716c" text-anchor="middle">returns them signed in</text>
<path d="M290.0,240 L290.0,278" fill="none" stroke="#0E8C79" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="304.0" y="263.0" font-size="11.5" font-weight="400" fill="#5f716c" text-anchor="start">forwards the request and the token to</text>
<rect x="40" y="284" width="500" height="64" rx="10" fill="#e6edf6" stroke="#2f5a8a" stroke-width="1.5" filter="url(#sh)"/>
<text x="58" y="311" font-size="14" font-weight="700" fill="#16302b" text-anchor="start">claims-echo</text>
<text x="58" y="332" font-size="11.5" font-weight="400" fill="#5f716c" text-anchor="start">the sample app: replies with the token's claims</text>
<path d="M290.0,352 L290.0,390" fill="none" stroke="#0E8C79" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="304.0" y="375.0" font-size="11.5" font-weight="400" fill="#5f716c" text-anchor="start">replies 200 with azp and groups, recorded as</text>
<rect x="40" y="396" width="500" height="64" rx="10" fill="#ffffff" stroke="#c9d6d2" stroke-width="1.5" filter="url(#sh)"/>
<text x="58" y="423" font-size="14" font-weight="700" fill="#16302b" text-anchor="start">Result</text>
<text x="58" y="444" font-size="11.5" font-weight="500" fill="#5f716c" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">group-gated  /  team-a  200  groups [/ct-team-a]</text>
<rect x="680" y="396" width="240" height="64" rx="10" fill="#e6edf6" stroke="#2f5a8a" stroke-width="1.5" filter="url(#sh)"/>
<text x="698" y="423" font-size="14" font-weight="700" fill="#16302b" text-anchor="start">expect.yaml</text>
<text x="698" y="444" font-size="11.5" font-weight="400" fill="#5f716c" text-anchor="start">team-a: 200, groups [/ct-team-a]</text>
<path d="M676,428.0 L546,428.0" fill="none" stroke="#0E8C79" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="610.0" y="420.0" font-size="11" font-weight="400" fill="#5f716c" text-anchor="middle">is compared with</text>
<path d="M290.0,464 L290.0,502" fill="none" stroke="#0E8C79" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="304.0" y="487.0" font-size="11.5" font-weight="400" fill="#5f716c" text-anchor="start">a match passes; a difference fails the spec with</text>
<rect x="40" y="508" width="500" height="64" rx="10" fill="#0E8C79" stroke="#0E8C79" stroke-width="1.5" filter="url(#sh)"/>
<text x="58" y="535" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Every differing cell listed</text>
<text x="58" y="556" font-size="11.5" font-weight="500" fill="#ffffff" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">group-gated / team-a: expected 200, got 403</text>
<rect x="40" y="611" width="16" height="16" rx="4" fill="#e6edf6" stroke="#2f5a8a" stroke-width="1.5"/>
<text x="66" y="624" font-size="11.5" font-weight="400" fill="#5f716c" text-anchor="start">From the test, under test/e2e/testdata/contract</text>
<rect x="384.0" y="611" width="16" height="16" rx="4" fill="#dff3ef" stroke="#0E8C79" stroke-width="1.5"/>
<text x="410.0" y="624" font-size="11.5" font-weight="400" fill="#5f716c" text-anchor="start">Installed on the cluster as in CI</text>
</svg>
